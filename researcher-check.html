<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSGT 배포 검사</title><link rel="stylesheet" href="assets/styles.css"></head><body><main><section class="panel"><p class="eyebrow">연구자 전용</p><h1>GitHub Pages–Collector 연결 검사</h1><p>이 페이지는 실제 참가자에게 공유하지 마세요. 시험 응답은 <code>prelaunch</code> 구획으로만 저장됩니다.</p><ol><li>config.js가 설정되었는지 확인</li><li>Collector health 확인</li><li>start 계약 확인</li><li>시험 제출과 삭제 확인</li></ol><button id="run">전체 검사 실행</button><pre id="out" style="white-space:pre-wrap;background:#101828;color:#e4e7ec;padding:1rem;border-radius:12px;overflow:auto"></pre><button id="download" disabled>검사 보고서 내려받기</button></section></main><script src="config.js"></script><script>
(()=>{"use strict";const C=window.KSGT_CONFIG||{},out=document.getElementById('out'),run=document.getElementById('run'),download=document.getElementById('download');let report=null;const line=x=>out.textContent+=x+'\n';const post=async b=>{const r=await fetch(C.collectorUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b),redirect:'follow'});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||String(r.status));return d};run.onclick=async()=>{out.textContent='';report={schema_version:'ksgt.deployment-check.v1',checked_at_utc:new Date().toISOString(),study_id:C.studyId,client_mode:C.launchMode,steps:[]};const step=async(name,fn)=>{try{const detail=await fn();report.steps.push({name,pass:true,detail});line('PASS  '+name);return detail}catch(e){report.steps.push({name,pass:false,error:e.message});line('FAIL  '+name+' — '+e.message);return null}};await step('config',async()=>{if(!C.collectorUrl||C.collectorUrl.includes('PASTE_'))throw new Error('collectorUrl 미설정');if(!C.contact||C.contact.includes('PASTE_'))throw new Error('contact 미설정');if(C.launchMode!=='prelaunch')throw new Error('첫 검사는 prelaunch 모드여야 함');return {collector_url:C.collectorUrl,contact:C.contact}});await step('health',async()=>{const r=await fetch(C.collectorUrl+'?action=health',{redirect:'follow',cache:'no-store'});const d=await r.json();if(!d.ok)throw new Error(d.error||'health failed');if(d.server_mode!==C.launchMode)throw new Error('서버와 페이지 모드 불일치');return d});const session=crypto.randomUUID();await step('start',()=>post({action:'start',study_id:C.studyId,session_id:session,consent_version:C.consentVersion,client_version:C.clientVersion,launch_mode:C.launchMode}));let receipt=null;await step('submit',async()=>{const payload={schema_version:'ksgt.human-pilot-response.v2',study_id:C.studyId,session_id:session,run_mode:'prelaunch',source_partition:'internal_owner',actor_type:'internal_owner_tester',human_evidence:false,external_human_evidence:false,consent_version:C.consentVersion,client_version:C.clientVersion,started_at_utc:new Date().toISOString(),finished_at_utc:new Date().toISOString(),ai_assistance_self_report:'none',responses:[{response_id:crypto.randomUUID(),item_id:'DEPLOYMENT-CHECK',presentation_order:'AB',display_left_variant:'A',display_right_variant:'B',impression_left:'연결 검사',impression_right:'연결 검사',comparison:'연결 검사',meaning_relation:'nearly_same',display_preference:'similar',canonical_preference:'similar',item_started_at_utc:new Date().toISOString(),item_finished_at_utc:new Date().toISOString(),paste_events:0,pasted_characters:0,input_events:1,text_sha256:'deployment-check'}],device:{user_agent:navigator.userAgent,language:navigator.language,viewport_css_px:[innerWidth,innerHeight],time_zone:Intl.DateTimeFormat().resolvedOptions().timeZone}};const d=await post({action:'submit',payload});receipt=d.receipt;return {receipt_hash:d.receipt.receipt_hash}});await step('delete',async()=>{if(!receipt)throw new Error('submit 실패로 삭제 검사 불가');return post({action:'delete',study_id:C.studyId,response_id:receipt.response_id,deletion_proof:receipt.deletion_proof})});report.all_passed=report.steps.every(x=>x.pass);line('\nRESULT: '+(report.all_passed?'ALL PASS':'HOLD'));download.disabled=false};download.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)+'\n'],{type:'application/json'}));a.download='KSGT_DEPLOYMENT_CHECK_REPORT.json';a.click();URL.revokeObjectURL(a.href)}})();
</script></body></html>
